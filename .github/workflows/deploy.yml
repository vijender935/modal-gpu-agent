name: CI and Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Test and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mcp-server/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile Python files
        working-directory: .
        run: python -m compileall -q app.py paths.py mcp-server/server.py scripts/staging_smoke_test.py

      - name: Run tests
        run: pytest -q tests

      - name: Run Ruff
        working-directory: .
        run: ruff check app.py mcp-server/server.py mcp-server/tests scripts

  deploy:
    name: Deploy GPU Agent
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install pinned Modal CLI
        run: python -m pip install modal==1.5.4

      - name: Deploy to Modal
        run: modal deploy app.py
